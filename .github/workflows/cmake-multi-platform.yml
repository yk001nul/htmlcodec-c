name: CMake on multiple platforms

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release, Debug]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            cmake_preset: x64-debug
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            cmake_preset: linux-x64-debug
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            cmake_preset: linux-x64-debug
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/out/build/${{ matrix.cmake_preset }}" >> "$GITHUB_OUTPUT"
        echo "install-dir=${{ github.workspace }}/out/install" >> "$GITHUB_OUTPUT"

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build

    - name: Configure CMake
      run: >
        cmake -B "${{ steps.strings.outputs.build-output-dir }}"
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_INSTALL_PREFIX="${{ steps.strings.outputs.install-dir }}"
        -S ${{ github.workspace }}/htmlcodec-c

    - name: Build
      run: cmake --build "${{ steps.strings.outputs.build-output-dir }}" --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

    - name: Install artifacts
      if: matrix.build_type == 'Release'
      run: cmake --install "${{ steps.strings.outputs.build-output-dir }}" --config ${{ matrix.build_type }}

    - name: Upload artifacts (Windows)
      if: runner.os == 'Windows' && matrix.build_type == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: htmlcodec-c-windows-x64
        path: |
          ${{ steps.strings.outputs.install-dir }}/bin/*
          ${{ steps.strings.outputs.build-output-dir }}/htmlcodec-c-shared.*
        retention-days: 30

    - name: Upload artifacts (Linux)
      if: runner.os == 'Linux' && matrix.build_type == 'Release' && matrix.c_compiler == 'gcc'
      uses: actions/upload-artifact@v4
      with:
        name: htmlcodec-c-linux-x64
        path: |
          ${{ steps.strings.outputs.install-dir }}/bin/*
          ${{ steps.strings.outputs.install-dir }}/lib/*
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          htmlcodec-c-windows-x64/*
          htmlcodec-c-linux-x64/*
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
